
include=~/.config/fuzzel/colors.ini
[main]
font=JetBrainsMono Nerd Font:size=12
terminal=alacritty
dpi-aware=yes

width=38
lines=10
horizontal-pad=20
vertical-pad=18
inner-pad=12

icons=yes
icon-theme=Adwaita

prompt="  "

layer=overlay

[border]
width=2
radius=18

[dmenu]
exit-immediately-if-empty=yes

[colors]
background={background}cc
text={foreground}ff
prompt={color4}ff
placeholder={color8}ff
input={foreground}ff

match={color4}ff

selection={color4}aa
selection-text={foreground}ff
selection-match={foreground}ff

counter={color5}ff
border={color4}aapty=yes
