background {
    monitor =
    path = screenshot

    blur_passes = 4
    blur_size = 8
    brightness = 0.75
    contrast = 1.1
    noise = 0.01
}

input-field {
    monitor =

    size = 280, 55
    position = 0, -100

    halign = center
    valign = center

    outline_thickness = 2

    outer_color = rgb({color4_strip})
    inner_color = rgb(0c141d)
    font_color = rgb(c2c4c6)

    check_color = rgb({color2_strip})
    fail_color = rgb({color1_strip})
    capslock_color = rgb({color3_strip})

    rounding = 14

    fade_on_empty = false

    placeholder_text = Password...
}

label {
    monitor =

    text = cmd[update:1000] date +"%H:%M"

    color = rgb(c2c4c6)
    font_size = 72
    font_family = JetBrainsMono Nerd Font

    position = 0, 180

    halign = center
    valign = center
}

label {
    monitor =

    text = cmd[update:60000] date +"%A, %d %B"

    color = rgb({color7_strip})
    font_size = 22

    position = 0, 120

    halign = center
    valign = center
}

label {
    monitor =

    text = $USER

    color = rgb({color4_strip})
    font_size = 20

    position = 0, -170

    halign = center
    valign = center
}
